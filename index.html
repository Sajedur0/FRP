<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Android FRP Remove Files — direct download center. FRP bypass APKs, Google Account Manager, launchers, file managers and more." />
<meta name="theme-color" content="#0b0f14" />
<title>FRP File Directory — Download Center</title>
<!--
  ─────────────────────────────────────────────────────────────
  100% STATIC — No backend required. Runs directly on GitHub Pages.

  How to deploy on GitHub Pages:
  1) GitHub Repo → Settings → Pages
  2) Source: "Deploy from a branch"
  3) Branch: main  |  Folder: / (root)  →  Save
  ✓ Site live: https://<username>.github.io/FRP/
  ─────────────────────────────────────────────────────────────
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0f14;
    --bg2: #10161d;
    --card: #141c25;
    --card-hover: #1a2430;
    --border: #223041;
    --text: #e8eef4;
    --muted: #8fa3b8;
    --accent: #3ddc84;
    --accent-dark: #22b566;
    --blue: #4da3ff;
    --orange: #ffb454;
    --purple: #b07cff;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(61,220,132,.08), transparent 60%),
      radial-gradient(900px 400px at 10% 0%, rgba(77,163,255,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(61,220,132,.25); }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px 32px; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ─────────────────────────── */
  header { padding: 48px 0 24px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 56px; height: 56px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, #3ddc84, #1fa45e);
    display: grid; place-items: center;
    box-shadow: 0 8px 30px rgba(61,220,132,.35);
    border: 1px solid rgba(255,255,255,.14);
  }
  .logo svg { width: 30px; height: 30px; display: block; }
  h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.6px; line-height: 1.15; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 14.5px; margin-top: 5px; line-height: 1.5; }

  /* ── Toolbar ────────────────────────── */
  .toolbar { margin-top: 22px; margin-bottom: 22px; }
  .search-row { display: flex; gap: 10px; }
  .search {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0 16px; transition: border-color .2s, box-shadow .2s;
    min-height: 52px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,220,132,.15); }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; display: block; }
  .search input {
    flex: 1; background: none; border: none; outline: none; width: 100%;
    color: var(--text); font: inherit; font-size: 15px; padding: 14px 0;
  }
  .search input::placeholder { color: var(--muted); opacity: .9; }

  /* ── File list ──────────────────────── */
  #list { min-height: 280px; flex: 1; }
  .group {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; background: var(--bg2);
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    transition: background .15s; animation: fadeUp .35s ease both;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--card-hover); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .fico {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    border: 1px solid rgba(255,255,255,.06);
  }
  .fico svg { width: 22px; height: 22px; display: block; }
  .fico.apk   { background: rgba(61,220,132,.13);  color: var(--accent); }
  .fico.xapk  { background: rgba(255,180,84,.13);  color: var(--orange); }
  .fico.doc   { background: rgba(77,163,255,.13);  color: var(--blue); }
  .fico.other { background: rgba(176,124,255,.13); color: var(--purple); }

  .finfo { flex: 1; min-width: 0; }
  .fname {
    font-weight: 600; font-size: 15px; line-height: 1.4; letter-spacing: -.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text); text-decoration: none; display: block;
    transition: color .15s;
  }
  a.fname:hover { color: var(--accent); }
  a.fname:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px;
  }
  .fmeta {
    display: flex; gap: 8px; align-items: center;
    margin-top: 4px; font-size: 12.5px; line-height: 1.4;
    color: var(--muted); flex-wrap: wrap;
  }
  .fmeta .sz { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .fmeta .sep { opacity: .4; }
  .fmeta .type {
    text-transform: uppercase; letter-spacing: .5px; font-size: 10.5px; font-weight: 700; line-height: 1.2;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px;
  }
  .viewlink { color: var(--blue); text-decoration: none; font-size: 12.5px; font-weight: 500; }
  .viewlink:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; display: none; }
  .empty .big { font-size: 40px; margin-bottom: 12px; line-height: 1; }

  footer { margin-top: 70px; padding-bottom: 8px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; opacity: .85; }
  footer a { color: var(--muted); text-decoration: none; font-weight: 500; }
  footer a:hover { color: var(--accent); text-decoration: none; }

  /* ── Toast ──────────────────────────── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--card); border: 1px solid var(--accent); color: var(--text);
    padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0;
    transition: transform .3s, opacity .3s; pointer-events: none;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-width: 90vw; text-align: center; z-index: 50;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast b { color: var(--accent); font-weight: 700; }

  @media (max-width: 560px) {
    header { padding: 32px 0 20px; }
    .logo { width: 48px; height: 48px; border-radius: 14px; }
    .logo svg { width: 26px; height: 26px; }
    .tagline { font-size: 13.5px; }
    .search { min-height: 50px; }
    .search input { font-size: 16px; }
    .row { gap: 12px; padding: 12px 14px; }
    .fico { width: 40px; height: 40px; }
    .fname { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#052b1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(5,43,26,.25)"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1>FRP File <span>Directory</span></h1>
        <div class="tagline">Android FRP Remove Files — download any file directly ⬇</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-row">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="text" placeholder="Search files by name…" autocomplete="off" />
        </label>
      </div>
    </div>
  </header>

  <main id="list"></main>
  <div class="empty" id="empty"><div class="big">🔍</div>No files found — try a different search term</div>

  <footer>
    © 2026 FRP File Directory · <a href="https://Zerofrp.blogspot.com" target="_blank" rel="noopener">Blog</a> · <a href="https://github.com/Sajedur0/FRP" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   All repo files are hardcoded here — no API/backend needed.
   To add a new file, just add one line to the list below:
   ["file_name", size_in_bytes]
   ════════════════════════════════════════════════════════════ */
const FILES = [
  ['Apex_Launcher.apk',               23519658],
  ['BypassFRP-1.0.apk',                1231829],
  ['Development_Settings.apk',           47737],
  ['ES_File_Explorer.apk',            11724728],
  ['File_Manager_2.5.9.apk',           6263002],
  ['Google_Account_Manager_10.apk',    8300263],
  ['Google_Account_Manager_4.0.apk',   4051474],
  ['Google_Account_Manager_4.4.4.apk', 5716290],
  ['Google_Account_Manager_5.0.1.apk', 7591241],
  ['Google_Account_Manager_5.1.apk',   4991563],
  ['Google_Account_Manager_6.0.1.apk', 8300263],
  ['Google_Account_Manager_7.0.apk',   8335873],
  ['Google_Account_Manager_7.1.1.apk', 6551358],
  ['Google_Account_Manager_7.1.2.apk', 6552461],
  ['Google_Account_Manager_8.0.apk',   8412302],
  ['Google_Account_Manager_8.1.apk',   8300263],
  ['Google_Account_Manager_9.0.apk',   6552461],
  ['Google_Play_Store_For_Android_TV.apk', 16959786],
  ['Google_Setting.apk',              29857043],
  ['Phone_Factory_Reset_1.3.apk',      1574057],
  ['QuickShortcutMaker.apk',           2115037],
  ['Setting.apk',                        47737],
  ['Simple_Control_2.1.2_Virgo.apk',   3650738],
  ['Smart_Switch_Mobile.apk',         31110461],
  ['Technocare.apk',                  29854986],
  ['Test_DPC.apk',                     2861928],
  ['Toffee_For_Android_TV.apk',       17337948],
  ['Xapk_Installer_Pro_1.4.apk',       2945761],
  ['YouTube_2.17.006.apk',            21733988],
  ['YouTube_v17.18.36.xapk',          49087469],
].map(([n, s]) => ({ n, s }));

/* GitHub blob link for docs */
const REPO_BLOB = 'https://github.com/Sajedur0/FRP/blob/main/';

const icon = t => t === 'apk'
  ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24c-2.86-1.21-6.08-1.21-8.94 0L5.65 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48A10.81 10.81 0 0 0 1 18h22a10.81 10.81 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 2.5 0 1.25 1.25 0 0 1-2.5 0zm10 0a1.25 1.25 0 1 1 2.5 0 1.25 1.25 0 0 1-2.5 0z"/></svg>`
  : t === 'xapk'
  ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>`
  : t === 'md' || t === 'txt'
  ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>`
  : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 8-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/></svg>`;

const humanSize = b => {
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(2)) + ' ' + u[i];
};
const pretty = n => n.replace(/\.(apk|xapk|md)$/i, '').replace(/_+/g, ' ').trim();
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── Init ─────────────────────────────────────────── */
(function init() {
  document.getElementById('q').addEventListener('input', render);
  render();
})();

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const out = FILES.filter(f =>
    (!q || f.n.toLowerCase().includes(q) || pretty(f.n).toLowerCase().includes(q))
  );
  out.sort((a, b) => a.n.localeCompare(b.n, undefined, { numeric: true }));
  return out;
}

function render() {
  const files = filtered();
  const list = document.getElementById('list');
  document.getElementById('empty').style.display = files.length ? 'none' : 'block';

  let i = 0;
  list.innerHTML = `<div class="group">${files.map(f => {
      const isDoc = /\.(md|txt)$/i.test(f.n);
      const href  = encodeURI(f.n);                       /* relative → works on GitHub Pages */
      return `
      <div class="row" style="animation-delay:${Math.min(i++ * 30, 300)}ms">
        <div class="fico ${f.n.endsWith('.apk') ? 'apk' : f.n.endsWith('.xapk') ? 'xapk' : isDoc ? 'doc' : 'other'}">${icon(f.n.split('.').pop().toLowerCase())}</div>
        <div class="finfo">
          <a class="fname" title="${esc(f.n)}" href="${href}" download="${esc(f.n)}" onclick="toast('${esc(f.n)}')">${esc(pretty(f.n))}</a>
          <div class="fmeta">
            <span class="sz">${humanSize(f.s)}</span><span class="sep">•</span>
            <span class="type">${esc(f.n.split('.').pop().toLowerCase())}</span>
            ${isDoc ? `<span class="sep">•</span><a class="viewlink" href="${REPO_BLOB + encodeURI(f.n)}" target="_blank" rel="noopener">View ↗</a>` : ''}
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
}

let toastTimer;
function toast(name) {
  const t = document.getElementById('toast');
  t.innerHTML = `⬇ Download started: <b>${esc(name)}</b>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
</body>
</html>
