<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Android FRP Remove Files — direct download center. FRP bypass APKs, Google Account Manager, launchers, file managers and more." />
<meta name="theme-color" content="#0b0f14" />
<title>FRP File Directory — Download Center</title>
<!--
  ─────────────────────────────────────────────────────────────
  100% STATIC — No backend required. Runs directly on GitHub Pages.

  How to deploy on GitHub Pages:
  1) GitHub Repo → Settings → Pages
  2) Source: "Deploy from a branch"
  3) Branch: main  |  Folder: / (root)  →  Save
  ✓ Site live: https://<username>.github.io/FRP/
  ─────────────────────────────────────────────────────────────
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0f14;
    --bg2: #10161d;
    --card: #141c25;
    --card-hover: #1a2430;
    --border: #223041;
    --text: #e8eef4;
    --muted: #8fa3b8;
    --accent: #3ddc84;
    --accent-dark: #22b566;
    --blue: #4da3ff;
    --orange: #ffb454;
    --purple: #b07cff;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(61,220,132,.08), transparent 60%),
      radial-gradient(900px 400px at 10% 0%, rgba(77,163,255,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(61,220,132,.25); }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px 32px; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ─────────────────────────── */
  header { padding: 48px 0 24px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.6px; line-height: 1.15; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 14.5px; margin-top: 5px; line-height: 1.5; }

  /* ── Toolbar ────────────────────────── */
  .toolbar { margin-top: 22px; margin-bottom: 22px; }
  .search-row { display: flex; gap: 10px; }
  .search {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0 16px; transition: border-color .2s, box-shadow .2s;
    min-height: 52px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,220,132,.15); }
  .search input {
    flex: 1; background: none; border: none; outline: none; width: 100%;
    color: var(--text); font: inherit; font-size: 15px; padding: 14px 0;
  }
  .search input::placeholder { color: var(--muted); opacity: .9; }

  /* ── File list ──────────────────────── */
  #list { min-height: 280px; flex: 1; }

  /* ── Open Apps section ──────────────── */
  #apps-section { margin-bottom: 26px; }
  .openbtn {
    flex: none; text-decoration: none;
    font-size: 13px; font-weight: 700; letter-spacing: .2px;
    color: #052b1a; background: var(--accent);
    border-radius: 10px; padding: 9px 16px;
    transition: filter .15s, transform .15s;
    white-space: nowrap;
  }
  .openbtn:hover { filter: brightness(1.1); }
  .openbtn:active { transform: scale(.96); }
  .openbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .row .pkg { color: var(--muted); font-weight: 400; font-size: 11.5px; }
  .group {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; background: var(--bg2);
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    transition: background .15s; animation: fadeUp .35s ease both;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--card-hover); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .fico {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    border: 1px solid rgba(255,255,255,.06);
  }
  .fico.app { padding: 0; overflow: hidden; background: #fff; }
  .fico.app img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .finfo { flex: 1; min-width: 0; }
  .fname {
    font-weight: 600; font-size: 15px; line-height: 1.4; letter-spacing: -.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text); text-decoration: none; display: block;
    transition: color .15s;
  }
  a.fname:hover { color: var(--accent); }
  a.fname:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px;
  }
  .fmeta {
    display: flex; gap: 8px; align-items: center;
    margin-top: 4px; font-size: 12.5px; line-height: 1.4;
    color: var(--muted); flex-wrap: wrap;
  }
  .fmeta .sz { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .fmeta .sep { opacity: .4; }
  .fmeta .type {
    text-transform: uppercase; letter-spacing: .5px; font-size: 10.5px; font-weight: 700; line-height: 1.2;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px;
  }
  .viewlink { color: var(--blue); text-decoration: none; font-size: 12.5px; font-weight: 500; }
  .viewlink:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; display: none; }
  .empty .big { font-size: 40px; margin-bottom: 12px; line-height: 1; }

  footer { margin-top: 70px; padding-bottom: 8px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; opacity: .85; }
  footer a { color: var(--muted); text-decoration: none; font-weight: 500; }
  footer a:hover { color: var(--accent); text-decoration: none; }

  /* ── Toast ──────────────────────────── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--card); border: 1px solid var(--accent); color: var(--text);
    padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0;
    transition: transform .3s, opacity .3s; pointer-events: none;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-width: 90vw; text-align: center; z-index: 50;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast b { color: var(--accent); font-weight: 700; }

  @media (max-width: 560px) {
    header { padding: 32px 0 20px; }
    .tagline { font-size: 13.5px; }
    .search { min-height: 50px; }
    .search input { font-size: 16px; }
    .row { gap: 12px; padding: 12px 14px; }
    .fico { width: 40px; height: 40px; }
    .fname { font-size: 14px; }
    .openbtn { padding: 8px 13px; font-size: 12.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div>
        <h1>FRP File <span>Directory</span></h1>
        <div class="tagline">Android FRP Remove Files — download any file directly ⬇</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-row">
        <label class="search">
          <input id="q" type="text" placeholder="Search files by name…" autocomplete="off" />
        </label>
      </div>
    </div>
  </header>

  <section id="apps-section">
    <div id="apps"></div>
  </section>

  <main id="list"></main>
  <div class="empty" id="empty"><div class="big">🔍</div>No files found — try a different search term</div>

  <footer>
    © 2026 FRP File Directory · <a href="https://Zerofrp.blogspot.com" target="_blank" rel="noopener">Blog</a> · <a href="https://github.com/Sajedur0/FRP" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   All repo files are hardcoded here — no API/backend needed.
   To add a new file, just add one line to the list below:
   ["file_name", size_in_bytes, icon_path]
   ════════════════════════════════════════════════════════════ */
const FILES = [
  ['Apex_Launcher.apk',               23519658, 'assets/icons/apk/apex-launcher.png'],
  ['BypassFRP-1.0.apk',                1231829, 'assets/icons/apk/bypassfrp.jpg'],
  ['Development_Settings.apk',           47737, 'assets/icons/apk/development-settings.png'],
  ['ES_File_Explorer.apk',            11724728, 'assets/icons/apk/es-file-explorer.png'],
  ['File_Manager_2.5.9.apk',           6263002, 'assets/icons/apk/file-manager.png'],
  ['Google_Account_Manager_10.apk',    8300263, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_4.0.apk',   4051474, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_4.4.4.apk', 5716290, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_5.0.1.apk', 7591241, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_5.1.apk',   4991563, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_6.0.1.apk', 8300263, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_7.0.apk',   8335873, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_7.1.1.apk', 6551358, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_7.1.2.apk', 6552461, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_8.0.apk',   8412302, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_8.1.apk',   8300263, 'assets/icons/apk/google-account.png'],
  ['Google_Account_Manager_9.0.apk',   6552461, 'assets/icons/apk/google-account.png'],
  ['Google_Play_Store_For_Android_TV.apk', 16959786, 'assets/icons/apk/play-store-tv.png'],
  ['Google_Setting.apk',              29857043, 'assets/icons/apk/google-setting.png'],
  ['Phone_Factory_Reset_1.3.apk',      1574057, 'assets/icons/apk/factory-reset.png'],
  ['QuickShortcutMaker.apk',           2115037, 'assets/icons/apk/quickshortcutmaker.png'],
  ['Setting.apk',                        47737, 'assets/icons/apk/setting.png'],
  ['Simple_Control_2.1.2_Virgo.apk',   3650738, 'assets/icons/apk/simple-control.png'],
  ['Smart_Switch_Mobile.apk',         31110461, 'assets/icons/apk/smart-switch.png'],
  ['Technocare.apk',                  29854986, 'assets/icons/apk/technocare.webp'],
  ['Test_DPC.apk',                     2861928, 'assets/icons/apk/test-dpc.png'],
  ['Toffee_For_Android_TV.apk',       17337948, 'assets/icons/apk/toffee-tv.png'],
  ['Xapk_Installer_Pro_1.4.apk',       2945761, 'assets/icons/apk/xapk-installer.png'],
  ['YouTube_2.17.006.apk',            21733988, 'assets/icons/apk/youtube.png'],
  ['YouTube_v17.18.36.xapk',          49087469, 'assets/icons/apk/youtube.png'],
].map(([n, s, icon]) => ({ n, s, icon }));

/* ════════════════════════════════════════════════════════════
   Direct "Open App" links — same idea as frpbypass.romstage.com
   Tap on Android → opens the system app directly via intent://
   Icons: local copies of romstage icons in assets/icons/
   [name, intent_url, package_hint, icon_path]
   ════════════════════════════════════════════════════════════ */
const OPEN_APPS = [
  ['Galaxy Store',            'intent://com.sec.android.app.samsungapps/#Intent;scheme=android-app;end',                 'com.sec.android.app.samsungapps',          'assets/icons/apps/galaxy-store.jpg'],
  ['Google Search',           'intent://com.google.android.googlequicksearchbox/#Intent;scheme=android-app;end',         'com.google.android.googlequicksearchbox',  'assets/icons/apps/google-search.png'],
  ['Settings',                'intent://com.android.settings/#Intent;scheme=android-app;end',                            'com.android.settings',                     'assets/icons/apps/settings.png'],
  ['Set Screen Lock',         'intent://com.google.android.gms/#Intent;scheme=promote_smartlock_scheme;end',            'com.google.android.gms',                   'assets/icons/apps/screen-lock.png'],
  ['EasyShare',               'intent://com.vivo.easyshare/#Intent;scheme=android-app;end',                              'com.vivo.easyshare',                       'assets/icons/apps/easyshare.png'],
  ['Moto',                    'intent://com.motorola.moto/#Intent;scheme=android-app;end',                               'com.motorola.moto',                        'assets/icons/apps/moto.png'],
  ['Motorola Launcher',       'intent://com.motorola.launcher3/#Intent;scheme=android-app;end',                         'com.motorola.launcher3',                   'assets/icons/apps/motorola-launcher.jpg'],
  ['Moto Secure',             'intent://com.motorola.securityhub/#Intent;scheme=android-app;end',                       'com.motorola.securityhub',                 'assets/icons/apps/moto-secure.png'],
  ['Google Assistant',        'intent://com.google.android.apps.googleassistant/#Intent;scheme=android-app;end',        'com.google.android.apps.googleassistant',  'assets/icons/apps/google-assistant.png'],
  ['Samsung My Files',        'intent://com.sec.android.app.myfiles/#Intent;scheme=android-app;end',                    'com.sec.android.app.myfiles',              'assets/icons/apps/samsung-my-files.png'],
  ['Mi File Manager',         'intent://com.mi.android.globalFileexplorer/#Intent;scheme=android-app;end',              'com.mi.android.globalFileexplorer',        'assets/icons/apps/mi-file-manager.png'],
  ['YouTube',                 'intent://com.google.android.youtube/#Intent;scheme=android-app;end',                     'com.google.android.youtube',               'assets/icons/apps/youtube.png'],
  ['Activity Manager',        'intent://com.activitymanager/#Intent;scheme=android-app;end',                             'com.activitymanager',                      'assets/icons/apps/activity-manager.png'],
  ['Samsung Calculator',      'intent://com.sec.android.app.popupcalculator/#Intent;scheme=android-app;end',             'com.sec.android.app.popupcalculator',      'assets/icons/apps/samsung-calculator.png'],
  ['Google Maps',             'intent://com.google.android.apps.maps/#Intent;scheme=android-app;end',                   'com.google.android.apps.maps',             'assets/icons/apps/google-maps.jpg'],
  ['Add Google Account',      'intent://com.google.android.gsf.login.LoginActivity/#Intent;scheme=android-app;end',     'login / gsf',                              'assets/icons/apps/add-google-account.png'],
  ['Samsung Home Launcher',   'intent://com.sec.android.app.launcher/#Intent;scheme=android-app;end',                   'com.sec.android.app.launcher',             'assets/icons/apps/home-launcher.png'],
  ['Alliance Shield',         'intent://com.rrivenllc.shieldx/#Intent;scheme=android-app;end',                          'com.rrivenllc.shieldx',                    'assets/icons/apps/alliance-shield.png'],
  ['Gmail',                   'intent://com.google.android.gm/#Intent;scheme=android-app;end',                          'com.google.android.gm',                    'assets/icons/apps/gmail.png'],
  ['Dial Pad',                'tel:123456789',                                                                          'tel',                                      'assets/icons/apps/dial-pad.png'],
  ['*#0*# Test Mode',         'tel:*%230*%23',                                                                           'adb / tecno infinix',                      'assets/icons/apps/test-mode.png'],
].map(([n, url, pkg, icon]) => ({ n, url, pkg, icon }));

/* GitHub blob link for docs */
const REPO_BLOB = 'https://github.com/Sajedur0/FRP/blob/main/';

const humanSize = b => {
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(2)) + ' ' + u[i];
};
const pretty = n => n.replace(/\.(apk|xapk|md)$/i, '').replace(/_+/g, ' ').trim();
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── Init ─────────────────────────────────────────── */
(function init() {
  document.getElementById('q').addEventListener('input', render);
  render();
})();

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const out = FILES.filter(f =>
    (!q || f.n.toLowerCase().includes(q) || pretty(f.n).toLowerCase().includes(q))
  );
  out.sort((a, b) => a.n.localeCompare(b.n, undefined, { numeric: true }));
  return out;
}

function filteredApps() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (!q) return OPEN_APPS;
  return OPEN_APPS.filter(a =>
    a.n.toLowerCase().includes(q) || (a.pkg && a.pkg.toLowerCase().includes(q))
  );
}

function render() {
  const files = filtered();
  const apps = filteredApps();
  const list = document.getElementById('list');
  const appsBox = document.getElementById('apps');
  const appsSection = document.getElementById('apps-section');
  document.getElementById('empty').style.display = (files.length || apps.length) ? 'none' : 'block';

  /* ── Top group: Direct Open Apps (romstage style) ── */
  appsSection.style.display = apps.length ? 'block' : 'none';
  let j = 0;
  appsBox.innerHTML = `<div class="group">${apps.map(a => `
      <div class="row" style="animation-delay:${Math.min(j++ * 30, 300)}ms">
        <div class="fico app"><img src="${esc(a.icon)}" alt="${esc(a.n)}" loading="lazy" onerror="this.remove()"></div>
        <div class="finfo">
          <a class="fname" title="${esc(a.n)}" href="${esc(a.url)}">${esc(a.n)}</a>
          <div class="fmeta">
            <span class="type">open app</span><span class="sep">•</span>
            <span class="pkg">${esc(a.pkg)}</span>
          </div>
        </div>
        <a class="openbtn" href="${esc(a.url)}">Open</a>
      </div>`).join('')}</div>`;

  let i = 0;
  list.innerHTML = `<div class="group">${files.map(f => {
      const isDoc = /\.(md|txt)$/i.test(f.n);
      const href  = encodeURI(f.n);                       /* relative → works on GitHub Pages */
      return `
      <div class="row" style="animation-delay:${Math.min(i++ * 30, 300)}ms">
        <div class="fico app"><img src="${esc(f.icon)}" alt="${esc(pretty(f.n))}" loading="lazy" onerror="this.remove()"></div>
        <div class="finfo">
          <a class="fname" title="${esc(f.n)}" href="${href}" download="${esc(f.n)}" onclick="toast('${esc(f.n)}')">${esc(pretty(f.n))}</a>
          <div class="fmeta">
            <span class="sz">${humanSize(f.s)}</span><span class="sep">•</span>
            <span class="type">${esc(f.n.split('.').pop().toLowerCase())}</span>
            ${isDoc ? `<span class="sep">•</span><a class="viewlink" href="${REPO_BLOB + encodeURI(f.n)}" target="_blank" rel="noopener">View ↗</a>` : ''}
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
}

let toastTimer;
function toast(name) {
  const t = document.getElementById('toast');
  t.innerHTML = `⬇ Download started: <b>${esc(name)}</b>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
</body>
</html>
